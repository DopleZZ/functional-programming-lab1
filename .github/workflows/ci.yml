name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Lint, Format, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell/actions/setup@v2
        with:
          ghc-version: '9.4.8'
          enable-stack: false
          enable-cabal: true
      - name: Cache cabal
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.cabal/bin
          key: ${{ runner.os }}-cabal-ghc-9.4.8-tools-${{ hashFiles('scripts/lint.sh', 'scripts/format-check.sh') }}
          restore-keys: |
            ${{ runner.os }}-cabal-ghc-9.4.8-tools-
      - name: Install tools (hlint, ormolu)
        run: |
          cabal update
          cabal install hlint ormolu --overwrite-policy=always
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH
      - name: Show tool versions
        run: |
          ghc --version
          hlint --version
          ormolu --version
      - name: Lint (hlint)
        run: bash scripts/lint.sh
      - name: Format check (ormolu)
        run: bash scripts/format-check.sh
      - name: Unit tests (runghc outputs)
        run: bash scripts/test_hs.sh
